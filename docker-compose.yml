
services:
  db:
    image: postgres:16
    container_name: gamehub-local-db
    environment:
      POSTGRES_DB: gamehub_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - gamehub_local_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamehub_local"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

volumes:
  gamehub_local_pgdata:
